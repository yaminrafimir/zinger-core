# Render Blueprint for Sakinah — New + > Blueprint in the Render dashboard.
# Free plan: the app sleeps after 15 min idle, and its data resets on every restart
# (the demo community is re-seeded automatically). For permanent data, switch
# `plan` to `starter` and add a disk, with SAKINAH_DATA pointing at its mountPath.
services:
  - type: web
    name: sakinah
    runtime: node
    rootDir: sakinah
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SAKINAH_SEED       # set to "0" for a real launch without demo accounts
        value: "1"
